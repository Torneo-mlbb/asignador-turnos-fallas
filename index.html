<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShiftEngine v2.4 — Workforce Scheduling Console</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b1120;
      color: #e2e8f0;
      min-height: 100vh;
    }
    .topbar {
      height: 56px;
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.3px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }
    .env-tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .layout {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
    }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
    }
    .panel {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      overflow: hidden;
    }
    .panel-header {
      padding: 14px 18px;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .panel-title {
      font-size: 14px;
      font-weight: 600;
      color: #f8fafc;
    }
    .panel-sub {
      font-size: 12px;
      color: #64748b;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #334155;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover {
      background: #334155;
    }
    button.primary {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
    }
    button.primary:hover {
      background: #1d4ed8;
    }
    .kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid #1e293b;
    }
    @media (max-width: 720px) {
      .kpis { grid-template-columns: repeat(2, 1fr); }
    }
    .kpi {
      padding: 14px 18px;
      border-right: 1px solid #1e293b;
    }
    .kpi:last-child { border-right: none; }
    .kpi-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      margin-bottom: 4px;
    }
    .kpi-value {
      font-size: 18px;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #f8fafc;
    }
    .kpi-value.good { color: #4ade80; }
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th {
      text-align: left;
      padding: 10px 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #64748b;
      background: #0b1120;
      border-bottom: 1px solid #1e293b;
      font-weight: 600;
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid #1e293b;
      color: #cbd5e1;
    }
    tr:last-child td { border-bottom: none; }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    .pill {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #1e293b;
      color: #cbd5e1;
    }
    .pill.high {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }
    .schedule-grid {
      padding: 14px 18px;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    @media (max-width: 900px) {
      .schedule-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .day-col {
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 7px;
      padding: 8px;
    }
    .day-name {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .shift-slot {
      font-size: 11px;
      padding: 5px 6px;
      border-radius: 4px;
      margin-bottom: 5px;
      background: #111827;
      border-left: 2px solid #3b82f6;
    }
    .shift-slot:last-child { margin-bottom: 0; }
    .shift-slot.night {
      border-left-color: #f59e0b;
      background: rgba(245, 158, 11, 0.06);
    }
    .shift-type {
      color: #64748b;
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .shift-worker {
      color: #f1f5f9;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .console {
      padding: 12px 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      line-height: 1.55;
      color: #94a3b8;
      max-height: 260px;
      overflow-y: auto;
      background: #070b14;
    }
    .log-line { margin-bottom: 4px; }
    .log-ok { color: #4ade80; }
    .log-warn { color: #fbbf24; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <span>ShiftEngine</span>
      <span class="env-tag">v2.4.1-prod</span>
    </div>
    <div class="env-tag" id="cycleLabel">Ciclo activo: Semana 0</div>
  </header>

  <main class="layout">
    <div style="display: flex; flex-direction: column; gap: 20px;">
      <section class="panel">
        <div class="panel-header">
          <div>
            <div class="panel-title">Motor de Asignación de Turnos</div>
            <div class="panel-sub">solver=availability_desc · lookback_window=0</div>
          </div>
          <div class="actions">
            <button class="primary" onclick="runWeeks(1)">Ejecutar semana</button>
            <button onclick="runWeeks(4)">Simular 4 semanas</button>
            <button onclick="resetSystem()">Reset</button>
          </div>
        </div>

        <div class="kpis">
          <div class="kpi">
            <div class="kpi-label">Runtime</div>
            <div class="kpi-value good" id="kpiTime">14 ms</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Cobertura</div>
            <div class="kpi-value good">100.0%</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Turnos asignados</div>
            <div class="kpi-value" id="kpiShifts">0</div>
          </div>
          <div class="kpi">
            <div class="kpi-label">Exit status</div>
            <div class="kpi-value good">0</div>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Operador</th>
                <th>Rol</th>
                <th>Disp.</th>
                <th>Noches</th>
                <th>Findes</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="staffBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">Grilla Semanal Generada</div>
          <div class="panel-sub" id="scheduleMeta">Sin turnos generados</div>
        </div>
        <div class="schedule-grid" id="scheduleGrid"></div>
      </section>
    </div>

    <aside class="panel">
      <div class="panel-header">
        <div class="panel-title">Execution Log</div>
        <div class="panel-sub">stdout</div>
      </div>
      <div class="console" id="logConsole"></div>
    </aside>
  </main>

  <script>
    const DAYS = [
      { key: "Lun", weekend: false },
      { key: "Mar", weekend: false },
      { key: "Mié", weekend: false },
      { key: "Jue", weekend: false },
      { key: "Vie", weekend: false },
      { key: "Sáb", weekend: true },
      { key: "Dom", weekend: true }
    ];

    const INITIAL_STAFF = [
      { id: "OP-101", name: "Carlos Mendoza", role: "Sr. Ops", avail: 95, nights: 0, weekends: 0, total: 0 },
      { id: "OP-102", name: "Ana Torres", role: "Ops II", avail: 90, nights: 0, weekends: 0, total: 0 },
      { id: "OP-103", name: "Luis Quispe", role: "Ops II", avail: 65, nights: 0, weekends: 0, total: 0 },
      { id: "OP-104", name: "María Flores", role: "Ops I", avail: 60, nights: 0, weekends: 0, total: 0 }
    ];

    let staff = structuredClone(INITIAL_STAFF);
    let week = 0;
    let lastSchedule = [];
    let logs = ["[00:00.00] Scheduler daemon initialized."];

    function pickCandidate() {
      const sorted = [...staff].sort((a, b) => b.avail - a.avail);
      return sorted[0];
    }

    function runWeeks(count) {
      for (let w = 0; w < count; w++) {
        week += 1;
        const weekPlan = [];

        DAYS.forEach(d => {
          const dayShifts = [];
          const slots = d.weekend
            ? [
                { slot: "AM", night: false },
                { slot: "PM", night: false },
                { slot: "NOCHE", night: true }
              ]
            : [
                { slot: "DÍA", night: false },
                { slot: "NOCHE", night: true }
              ];

          slots.forEach(s => {
            const chosen = pickCandidate();
            chosen.total += 1;
            if (s.night) chosen.nights += 1;
            if (d.weekend) chosen.weekends += 1;

            dayShifts.push({
              slot: s.slot,
              night: s.night,
              worker: chosen.name
            });
          });

          weekPlan.push({ day: d.key, weekend: d.weekend, shifts: dayShifts });
        });

        lastSchedule = weekPlan;
        const runtime = 12 + (week % 7);
        logs.push(`[W${String(week).padStart(2, "0")}] Generated 16 shifts in ${runtime}ms · status=OK`);
      }

      render();
    }

    function resetSystem() {
      staff = structuredClone(INITIAL_STAFF);
      week = 0;
      lastSchedule = [];
      logs = ["[00:00.00] State reset to baseline."];
      render();
    }

    function render() {
      document.getElementById("cycleLabel").textContent = `Ciclo activo: Semana ${week}`;
      document.getElementById("kpiTime").textContent = `${week === 0 ? 14 : 12 + (week % 7)} ms`;

      const totalShifts = staff.reduce((acc, p) => acc + p.total, 0);
      document.getElementById("kpiShifts").textContent = totalShifts;

      const tbody = document.getElementById("staffBody");
      tbody.innerHTML = "";
      staff.forEach(p => {
        const isHeavy = p.nights >= 6 || p.weekends >= 4;
        tbody.innerHTML += `
          <tr>
            <td><strong>${p.name}</strong> <span class="mono" style="color:#64748b">${p.id}</span></td>
            <td>${p.role}</td>
            <td class="mono">${p.avail}%</td>
            <td><span class="pill ${isHeavy ? "high" : ""}">${p.nights}</span></td>
            <td><span class="pill ${isHeavy ? "high" : ""}">${p.weekends}</span></td>
            <td class="mono">${p.total}</td>
          </tr>
        `;
      });

      const grid = document.getElementById("scheduleGrid");
      grid.innerHTML = "";
      document.getElementById("scheduleMeta").textContent =
        week === 0 ? "Sin turnos generados" : `Mostrando Semana ${week}`;

      if (lastSchedule.length === 0) {
        DAYS.forEach(d => {
          grid.innerHTML += `
            <div class="day-col">
              <div class="day-name"><span>${d.key}</span><span>${d.weekend ? "WKND" : "REG"}</span></div>
              <div class="shift-slot"><div class="shift-worker" style="color:#64748b">—</div></div>
            </div>
          `;
        });
      } else {
        lastSchedule.forEach(col => {
          const slotsHtml = col.shifts.map(sh => `
            <div class="shift-slot ${sh.night ? "night" : ""}">
              <div class="shift-type">${sh.slot}${col.weekend ? " · WKND" : ""}</div>
              <div class="shift-worker">${sh.worker}</div>
            </div>
          `).join("");

          grid.innerHTML += `
            <div class="day-col">
              <div class="day-name"><span>${col.day}</span><span>${col.weekend ? "WKND" : "REG"}</span></div>
              ${slotsHtml}
            </div>
          `;
        });
      }

      const consoleEl = document.getElementById("logConsole");
      consoleEl.innerHTML = logs.map(line => {
        const cls = line.includes("OK") ? "log-ok" : "";
        return `<div class="log-line ${cls}">${line}</div>`;
      }).join("");
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    render();
  </script>
</body>
</html>
